name: Hypertransition NFT Trends Pilot

on:
  push:
    paths:
      - "hypertransition/**"
      - ".github/workflows/hypertransition-trends.yml"
  pull_request:
    paths:
      - "hypertransition/**"
      - ".github/workflows/hypertransition-trends.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r hypertransition/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Collect through browser
        continue-on-error: true
        run: python hypertransition/browser_collector.py 2>&1 | tee hypertransition/browser_collector.log
      - name: Upload collection result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypertransition-nft-browser
          path: |
            hypertransition/output_browser
            hypertransition/browser_collector.log
          if-no-files-found: warn
