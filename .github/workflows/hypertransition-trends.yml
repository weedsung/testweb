name: Hypertransition NFT Trends Pilot
on:
  push:
    paths:
      - "hypertransition/collector.py"
      - "hypertransition/requirements.txt"
      - ".github/workflows/hypertransition-trends.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r hypertransition/requirements.txt
      - name: Collect
        continue-on-error: true
        run: python hypertransition/collector.py 2>&1 | tee hypertransition/collector.log
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "hypertransition-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hypertransition/output hypertransition/collector.log || true
          if git diff --cached --quiet; then
            echo "No outputs"
          else
            git commit -m "data: collect NFT Google Trends pilot"
            git push
          fi
